<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque da Horta Comunitária</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Estoque da Horta Comunitária</h1>
    <p>Veja o que vence primeiro, distribua a tempo e registre as perdas.</p>
  </header>

  <main>
    <section class="resumo" aria-label="Resumo do estoque">
      <div class="indicador"><span id="r-total">0</span><small>kg em estoque</small></div>
      <div class="indicador atencao"><span id="r-atencao">0</span><small>produtos perto de vencer</small></div>
      <div class="indicador"><span id="r-saida">0</span><small>kg distribuídos</small></div>
      <div class="indicador perda"><span id="r-perda">0</span><small>kg perdidos</small></div>
    </section>

    <section class="cadastro">
      <h2>Cadastrar colheita</h2>
      <form id="form">
        <label>Produto
          <input id="nome" required maxlength="40" placeholder="Ex.: Alface">
        </label>
        <label>Quantidade (kg)
          <input id="qtd" type="number" min="0.1" step="0.1" required>
        </label>
        <label>Validade
          <input id="validade" type="date" required>
        </label>
        <button type="submit">Adicionar ao estoque</button>
      </form>
    </section>

    <section>
      <h2>Estoque (o que vence primeiro aparece no topo)</h2>
      <ul id="lista" class="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
